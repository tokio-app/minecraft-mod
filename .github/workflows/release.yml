name: Release

# Push a tag v<version> matching gradle.properties to build and test the mod and publish a GitHub
# release with its jar. A rerun only replaces the jar, so notes already edited in the release are kept.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches gradle.properties
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match gradle.properties version $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: gradle/actions/wrapper-validation@v6

      # Sets JAVA_HOME, which meets gradle/gradle-daemon-jvm.properties (Java 25).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # The open-source (MIT) cache: the default one is a proprietary component with its own terms.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Compiles, runs the unit tests and the server game tests, and writes the jar.
      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          if-no-files-found: error
          path: build/libs/tokio-${{ env.VERSION }}.jar # not the -sources jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for the notes

      # Lists the commits since the previous v* tag, grouped by Conventional Commits type.
      - name: Write release notes
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            # gh uploads the jar before publishing the release.
            gh release create "$GITHUB_REF_NAME" assets/* --verify-tag \
              --title "Tokio for Minecraft ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
