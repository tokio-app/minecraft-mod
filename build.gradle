plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	mods {
		"tokio" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "tokio-test"
		enableGameTests = true
		enableClientGameTests = false
		// By setting this to true, you agree to the Minecraft EULA
		// (https://aka.ms/MinecraftEULA). The user agreed to it for the game tests.
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	// A fake Tokio for the connection's tests; never in the mod's jar
	testImplementation "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
